name: CI

on:
  push:
    branches: [main, develop, "spec/**", "impl/**"]
  pull_request:
    branches: [main, develop]

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  detect-changes:
    name: Detect changed paths
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: read
      pull-requests: read
    outputs:
      infra: ${{ steps.filter.outputs.infra }}
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
      - uses: dorny/paths-filter@0e4a8c6effa4802afeda77dc8d303f8176d7dfad # v3
        id: filter
        with:
          filters: |
            infra:
              - 'infra/**'
              - '**/*.tf'

  cloud-init-size:
    name: cloud-init custom_data size guard
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
      - name: Reject a cloud-init that cannot fit in Azure custom_data
        run: |
          set -euo pipefail
          python3 - <<'PY'
          # Azure caps the DECODED custom_data payload at 65535 bytes. Going over does not fail
          # at plan time - it fails during apply with an opaque error, after the resource group,
          # network and disks already exist. So bound it here instead.
          #
          # The template is rendered by templatefile() in main.tf, so the committed file is not
          # the payload. Every ${var} is replaced by a value whose length is only known at apply
          # time, and demo_fqdn alone is substituted ~10 times. This computes an UPPER BOUND by
          # substituting the longest value each variable is allowed to take, so a green build
          # means every legal tfvars combination fits.
          import collections
          import pathlib
          import re
          import sys

          LIMIT = 65535
          template = pathlib.Path("infra/adabas-natural-lab/cloud-init.yaml")
          text = template.read_text(encoding="utf-8")

          # "$${x}" is an escaped literal, not a substitution. Hide it before scanning.
          sentinel = "\x00ESCAPED\x00"
          scan = text.replace("$${", sentinel)

          # Longest legal value per variable.
          #   dns_label_prefix caps at 52 chars (validation in variables.tf) and the longest
          #   Azure region name is ~18 chars ("germanywestcentral"), so:
          #     demo_fqdn = 52 + 1 + 18 + len(".cloudapp.azure.com") = 90
          WORST = {
              "demo_fqdn": 90,
              "caddy_tls_directive": 90 + 45,   # embeds demo_fqdn plus a comment prefix
              "caddy_global_options": 80,       # "email <address>"
              "key_vault_uri": 80,
              "terminal_natural_command": 120,
              "modern_app_upstream": 64,
              "adabas_admin_bind": 32,
              "adabas_dbid": 5,
              "basic_auth_username": 64,
              "basic_auth_secret_name": 64,
              "basic_auth_secret_kind": 16,
              "secret_name": 64,
          }
          DEFAULT_IMAGE_LEN = 72   # registry/repository:tag

          occurrences = collections.Counter(re.findall(r"\$\{(\w+)\}", scan))
          if not occurrences:
              print("::error::no template variables found - has the render contract changed?")
              sys.exit(1)

          rendered = scan
          unknown = []
          for name, count in occurrences.items():
              if name in WORST:
                  width = WORST[name]
              elif name.endswith("_image"):
                  width = DEFAULT_IMAGE_LEN
              else:
                  # A new variable nobody sized. Assume it is large rather than silently
                  # under-counting it.
                  width = 128
                  unknown.append(name)
              rendered = rendered.replace("${%s}" % name, "X" * width)

          size = len(rendered.replace(sentinel, "${").encode("utf-8"))
          headroom = LIMIT - size

          print(f"committed template : {len(text.encode('utf-8')):>6} bytes")
          print(f"worst-case render  : {size:>6} bytes")
          print(f"Azure limit        : {LIMIT:>6} bytes")
          print(f"headroom           : {headroom:>6} bytes")
          print()
          print("substitution counts (worst-case width):")
          for name, count in occurrences.most_common():
              width = WORST.get(name, DEFAULT_IMAGE_LEN if name.endswith("_image") else 128)
              print(f"  {name:<26} x{count:<3} @ {width}")

          for name in unknown:
              print(
                  f"::warning file={template}::template variable '{name}' has no worst-case "
                  f"width; assuming 128 bytes. Add it to WORST in this workflow."
              )

          if headroom < 0:
              print(
                  f"::error file={template}::rendered cloud-init would be {size} bytes, "
                  f"{-headroom} over Azure's {LIMIT}-byte custom_data limit. Move content to the "
                  f"checksummed SSH payload instead of inlining it."
              )
              sys.exit(1)

          # Fail before the wall, not at it: a change that lands with 200 bytes to spare leaves
          # the next contributor no room and no warning.
          if headroom < 512:
              print(
                  f"::error file={template}::only {headroom} bytes of custom_data headroom "
                  f"remain (minimum 512). Move something to the SSH payload."
              )
              sys.exit(1)

          if headroom < 2048:
              print(
                  f"::warning file={template}::custom_data headroom is down to {headroom} "
                  f"bytes. Prefer the SSH payload for anything new."
              )
          PY

  natural-format:
    name: Natural format guard
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
      - name: Reject comma decimal format specs
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path
          import re
          import sys

          root = Path("01-archaeology/legacy-sifap/natural-programs")
          pattern = re.compile(r"\(([NP]\d+),(\d+)((?:/\d+:\d+(?:,\d+:\d+)*)?)\)")
          failures = []

          for path in sorted(root.rglob("*")):
              if not path.is_file():
                  continue
              for line_number, line in enumerate(path.read_text(errors="replace").splitlines(), 1):
                  for match in pattern.finditer(line):
                      spec = match.group(0)
                      fix = f"({match.group(1)}.{match.group(2)}{match.group(3)})"
                      failures.append((path, line_number, spec, fix))

          for path, line_number, spec, fix in failures:
              print(
                  f"::error file={path},line={line_number}::"
                  f"Natural CE 9.3.3 rejects comma decimal format {spec} with NAT0165. Use {fix}."
              )

          if failures:
              sys.exit(1)
          PY

  provisioning-contracts:
    name: Legacy lab provisioning contracts
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
      - uses: actions/setup-python@e797f83bcb11b83ae66e0230d6156d7c80228e7c # v6
        with:
          python-version: "3.12"
      - name: Install pytest
        run: |
          set -euo pipefail
          python3 -m pip install --disable-pip-version-check --quiet pytest
      # The FDT derivation, the ADACMP E4 framing and the loader utility chain were each
      # established empirically against Adabas CE and are easy to break silently: a wrong
      # descriptor column or a 2-byte occurrence count still produces a file that loads,
      # just with the wrong data. These tests pin that behaviour. `not live` drops the one
      # test that needs a running Adabas container, which a hosted runner does not have.
      - name: Run offline provisioning contract tests
        working-directory: infra/adabas-natural-lab
        run: |
          set -euo pipefail
          python3 -m pytest tests -m "not live" -q
          python3 -m py_compile audit-plan.py
      - name: Lint provisioning and deployment shell scripts
        run: |
          set -euo pipefail
          shellcheck \
            infra/adabas-natural-lab/preflight-local.sh \
            infra/adabas-natural-lab/deploy-local.sh \
            infra/adabas-natural-lab/install-payload-from-github.sh \
            infra/adabas-natural-lab/provisioning/*.sh
      - name: Verify the Brasilia morning window and target boundaries
        shell: pwsh
        run: ./infra/morning-start/tests/runbook.tests.ps1
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version: "24"
      - name: Verify public landing and viewer-session boundaries
        working-directory: infra/adabas-natural-lab/provisioning/viewer-access
        run: |
          npm run build
          npm test
          node build-landing.mjs
          git diff --exit-code -- ../../payload-static/www/index.html
      - name: Build and verify the SSH payload archive
        run: |
          set -euo pipefail
          archive="${RUNNER_TEMP}/sifap-payload.tar.gz"
          stage="${RUNNER_TEMP}/sifap-payload"
          SIFAP_PAYLOAD_ARCHIVE="$archive" infra/adabas-natural-lab/deploy-local.sh package
          mkdir -p "$stage"
          tar -xzf "$archive" -C "$stage"
          ( cd "$stage" && sha256sum -c --quiet manifest.sha256 )
          leaked=$(find "$stage" \
            \( -path '*/ngd-work/*' -o -path '*/ddm-work/*' -o -path '*/__pycache__/*' -o -name ngd_encoder.py \) \
            -print -quit)
          [ -z "$leaked" ] || { echo "::error::Scratch leaked into payload: $leaked"; exit 1; }
      - name: Verify no scratch or dead code reaches the VM payload
        run: |
          set -euo pipefail
          leaked=$(git ls-files 'infra/adabas-natural-lab/provisioning/**' \
            | grep -E '/(ngd-work|ddm-work|__pycache__|work)/|ngd_encoder\.py' || true)
          if [ -n "$leaked" ]; then
            echo "::error::Experimental scratch is tracked and would be staged to the lab VM:"
            printf '%s\n' "$leaked"
            exit 1
          fi

  repo-hygiene:
    name: No state, credentials or plans tracked
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
      # This repository owns the live lab. Terraform state embeds resource identifiers and
      # generated passwords, and `.tfvars` carries subscription and tenant identifiers, so a
      # single careless `git add -A` would publish them. `.gitignore` is not a guarantee
      # because `git add -f` bypasses it, so the build fails on tracked artifacts instead.
      - name: Fail if forbidden artifacts are tracked
        run: |
          set -euo pipefail
          tracked=$(git ls-files | grep -E '(^|/)\.env($|\.)|\.tfstate($|\.)|\.tfvars$|\.tfplan$|(^|/)id_(rsa|ed25519)$|\.(pem|pfx|p12|key)$' || true)
          if [ -n "$tracked" ]; then
            echo "::error::Forbidden artifacts are tracked in this repository:"
            printf '%s\n' "$tracked"
            exit 1
          fi
          echo "No state, plan, credential or environment files are tracked."

  infra:
    name: Infra (Terraform)
    needs: detect-changes
    if: needs.detect-changes.outputs.infra == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    defaults:
      run:
        shell: bash
        working-directory: infra
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
      - uses: hashicorp/setup-terraform@b9cd54a3c349d3f38e8881555d616ced269862dd # v3
        with:
          # Must be >= the version that last wrote the state file. Terraform state
          # is forward-only: 1.9.5 cannot read state written by 1.14.6, so CI would
          # fail on any command that loads state.
          terraform_version: "1.14.6"
      - name: Format check
        run: |
          set -euo pipefail
          terraform fmt -check -recursive
      - name: Validate
        run: |
          set -euo pipefail
          # `terraform validate` only ever looks at the CURRENT directory. Running it in infra/,
          # which holds no root .tf files, returned a vacuous "Success!" and validated nothing.
          # Walk every directory that actually declares Terraform and validate each one.
          shopt -s nullglob
          modules=$(find . -type f -name '*.tf' -not -path '*/.terraform/*' -exec dirname {} \; | sort -u)
          if [ -z "$modules" ]; then
            echo "No Terraform modules found under infra/" >&2
            exit 1
          fi
          for dir in $modules; do
            echo "::group::validate $dir"
            terraform -chdir="$dir" init -backend=false -input=false
            terraform -chdir="$dir" validate
            echo "::endgroup::"
          done
